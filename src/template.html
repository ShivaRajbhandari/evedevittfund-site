<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A1240;--blue:#2445F0;--sky:#5BCEFA;--pink:#F7A8C1;--yellow:#FFCF3F;--cream:#FFF9EA;--white:#fff;
--display:'Bowlby One',Impact,sans-serif;--label:'Barlow Condensed',sans-serif;--body:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--blue);color:var(--white);font:500 18px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.skip{position:absolute;left:-999px}.skip:focus{left:10px;top:10px;background:var(--yellow);color:var(--ink);padding:8px 12px;z-index:99}
.tbd{background:rgba(255,222,0,.35);border-bottom:2px dashed #7a5a00;padding:0 3px;color:inherit}
.qe{position:fixed;top:10px;right:12px;z-index:80;font:700 13px/1 var(--label);letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:8px 13px;cursor:pointer}
/* Awning */
.awning{height:34px;background:repeating-linear-gradient(90deg,var(--sky) 0 40px,var(--pink) 40px 80px,#fff 80px 120px,var(--pink) 120px 160px,var(--sky) 160px 200px);position:relative;z-index:30}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:
radial-gradient(circle at 20px 0,var(--sky) 19px,transparent 20px) 0 0/40px 14px repeat-x,
radial-gradient(circle at 20px 0,var(--pink) 19px,transparent 20px) 40px 0/40px 14px repeat-x;filter:drop-shadow(0 3px 0 rgba(10,18,64,.35))}
.nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px clamp(18px,4vw,56px) 12px;padding-right:clamp(130px,13vw,170px);background:var(--blue)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font:400 20px/1 var(--display);color:#fff;text-transform:uppercase}
.brand svg{width:34px;height:44px;flex:none;color:#fff}
.nav nav{display:flex;gap:22px;align-items:center;font:700 17px var(--label);letter-spacing:.08em;text-transform:uppercase}
.nav nav a{text-decoration:none;white-space:nowrap}.nav .brand span{white-space:nowrap}@media (max-width:1180px){.nav nav{gap:14px;font-size:15px;letter-spacing:.04em}.nav .brand span{font-size:.9em}}.nav nav a:hover{text-decoration:underline;text-underline-offset:5px}
.nav .give{background:var(--yellow);color:var(--ink);padding:9px 16px;border-radius:8px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
section{padding:clamp(56px,8vw,112px) clamp(18px,4vw,56px)}
.in{max-width:1180px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:1}
h2{font-size:clamp(30px,4.6vw,58px);margin-bottom:18px;letter-spacing:-.005em}
.eyebrow{font:700 17px var(--label);letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
/* Hero */
.hero{padding-top:clamp(30px,5vw,70px)}
.hero .in{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:center}
.hero h1{font-size:clamp(34px,5.6vw,80px);margin:14px 0 22px;color:#fff}
.hero h1 .big{display:block;color:var(--yellow);font-size:1.5em;line-height:.92;text-shadow:5px 5px 0 var(--ink)}
.hero p.lede{font-size:clamp(19px,2vw,24px);max-width:29em;font-weight:600}
.cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-block;text-decoration:none;font:400 17px/1 var(--display);text-transform:uppercase;padding:16px 24px;border-radius:10px;border:3px solid var(--ink);background:#fff;color:var(--ink);box-shadow:5px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--ink)}
.btn.y{background:var(--yellow)}.btn.p{background:var(--pink)}
.art{position:relative;display:grid;place-items:center}
.art svg.idaho{width:min(360px,80%);height:auto;filter:drop-shadow(10px 10px 0 var(--ink));transform:rotate(-3deg);color:var(--ink)}
/* Help */
.help{background:var(--yellow);color:var(--ink)}
.help .eyebrow{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:30px}
.card{background:#fff;border:4px solid var(--ink);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px;box-shadow:9px 9px 0 var(--ink)}
.card:nth-child(1){background:var(--sky)}.card:nth-child(2){background:var(--pink)}
.card .tag{font:700 16px var(--label);letter-spacing:.14em;text-transform:uppercase}
.card h3{font-size:26px}
.card p{font-size:17px;flex:1}
.card .btn{align-self:flex-start;box-shadow:4px 4px 0 var(--ink);font-size:15px;padding:13px 18px}
/* How it works */
.how{background:var(--cream);color:var(--ink)}
.how .eyebrow{color:var(--blue)}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:28px;counter-reset:s}
.steps li{position:relative;padding-top:78px}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:60px;height:60px;border-radius:50%;background:var(--blue);color:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;font:400 28px var(--display)}
.steps h3{font-size:22px;margin-bottom:8px}
.how .safe{margin-top:34px;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:20px 24px;box-shadow:7px 7px 0 var(--pink);font-weight:600}
/* Gift */
.gift{background:var(--pink);color:var(--ink)}
.amts{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:28px}
.amt{background:#fff;border:4px solid var(--ink);border-radius:16px;padding:24px;box-shadow:8px 8px 0 var(--ink)}
.amt strong{display:block;font:400 clamp(40px,5vw,64px)/1 var(--display);color:var(--blue)}
.amt span{font-weight:600}
.scholars{background:var(--cream);color:var(--ink)}
.scholars h2{color:var(--ink)}.scholars .eyebrow{color:var(--blue)}
.scholars .yr{font:400 28px var(--display);text-transform:uppercase;margin:28px 0 12px;color:var(--blue)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,255px),1fr));gap:18px}
.sgrid article{background:#fff;border:4px solid var(--ink);border-radius:14px;padding:16px 18px;box-shadow:6px 6px 0 var(--pink)}
.sgrid .who{display:flex;align-items:center;gap:12px;margin-bottom:10px}.sgrid .who img{width:56px;height:56px;flex:none;border-radius:50%;border:3px solid var(--ink);object-fit:cover}.sgrid h4{font:400 15px/1.15 var(--display);text-transform:uppercase;margin:0;min-width:0;overflow-wrap:anywhere}
.sgrid p{margin:0;font-size:15.5px;line-height:1.5}
.foot a{color:inherit}
.about h3.story{font:400 24px var(--display);text-transform:uppercase;margin:28px 0 8px;color:var(--yellow)}.about .storylink{color:#fff;font-weight:700}
.zeffy{margin-top:24px;max-width:760px}
/* About + board */
.about .in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(24px,5vw,64px)}
.about p{margin-bottom:16px}
.board{list-style:none;padding:0;display:grid;gap:16px}
.board li{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:center;background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:14px;padding:12px 16px;box-shadow:6px 6px 0 var(--sky)}
.board .av{width:72px;height:72px;border-radius:50%;border:4px solid var(--ink);background:repeating-linear-gradient(135deg,var(--sky) 0 8px,var(--pink) 8px 16px);display:grid;place-items:center;font:400 22px var(--display);color:var(--ink);overflow:hidden}
.board .av img{width:100%;height:100%;object-fit:cover;display:block}
.board strong{display:block;font:400 19px/1.1 var(--display);text-transform:uppercase}
.board small{display:block;font:700 14px var(--label);letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:2px 0 4px}
.board span.b{font-size:15.5px;line-height:1.4;display:block}
/* Donate */
.donate{background:var(--yellow);color:var(--ink)}
.donate .in{max-width:900px}
.amounts{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}
.amounts a{min-width:88px;text-align:center;text-decoration:none;font:400 20px var(--display);padding:14px 18px;border:4px solid var(--ink);border-radius:10px;background:#fff;box-shadow:4px 4px 0 var(--ink)}
.amounts a:hover{background:var(--pink)}
.fine{font-size:15px;font-weight:500}
/* Crisis + footer */
.crisis{background:var(--sky);color:var(--ink);padding-block:48px}
.crisis h2{font-size:clamp(24px,3.4vw,38px)}
.crisis ul{list-style:none;padding:0;display:grid;gap:4px;font-weight:600}
.foot{background:var(--ink);color:#fff;padding:44px clamp(18px,4vw,56px);font-size:16px}
.foot .in{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.foot h3{font-size:16px;margin-bottom:10px;color:var(--yellow)}
.foot p{margin-bottom:4px}
.legal{grid-column:1/-1;border-top:2px solid rgba(255,255,255,.25);padding-top:18px;font-size:14px;opacity:.9}
@media (max-width:900px){
 .hero .in,.about .in{grid-template-columns:1fr}
 .cards,.steps,.amts,.foot .in{grid-template-columns:1fr}
 .nav nav{display:none}.nav{padding-right:118px}
 .art{margin-top:8px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}
</style>
</head>
